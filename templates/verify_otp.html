<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - HashGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-header">
                <div class="brand-logo">HG</div>
                <h1 class="brand-title">{{ page_title }}</h1>
                <p class="brand-subtitle">Enter the 6-digit code sent to your email</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} mb-3" role="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="otp-timer-badge">
                <span class="security-badge">&#9201; Code expires in 5 minutes</span>
            </div>

            <form method="POST" action="{{ url_for('verify_otp') }}" data-validate>
                <div class="mb-3">
                    <label for="otp_code" class="form-label">Verification Code</label>
                    <input type="text" class="form-control otp-input" id="otp_code" name="otp_code"
                           placeholder="000000" required maxlength="6" pattern="[0-9]{6}"
                           inputmode="numeric" autocomplete="one-time-code">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Verify Code</button>
            </form>

            <form method="POST" action="{{ url_for('resend_otp') }}" class="text-center">
                <button type="submit" class="btn btn-outline-light w-100 resend-btn" id="resendBtn">
                    Resend Code
                </button>
            </form>

            <div class="auth-links">
                <p class="mb-0">
                    <a href="{{ url_for('login') }}">Back to login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
