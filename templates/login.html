<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HashGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-header">
                <div class="brand-logo">HG</div>
                <h1 class="brand-title">HashGuard</h1>
                <p class="brand-subtitle">File Integrity Management System</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} mb-3" role="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}" data-validate>
                <div class="mb-3">
                    <label for="identifier" class="form-label">Username or Email</label>
                    <input type="text" class="form-control" id="identifier" name="identifier"
                           placeholder="Enter username or email" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Enter password" required autocomplete="current-password">
                </div>
                <div class="mb-3">
                    <label for="captcha" class="form-label d-block">Security CAPTCHA</label>
                    <div class="d-flex align-items-center mb-2">
                        <img id="captcha-img" src="{{ url_for('captcha_route') }}" alt="CAPTCHA" class="border border-secondary rounded" style="width: 150px; height: 50px;">
                        <button type="button" class="btn btn-outline-light btn-sm ms-2" onclick="refreshCaptcha()">
                            &#8635; Refresh
                        </button>
                    </div>
                    <input type="text" class="form-control" id="captcha" name="captcha"
                           placeholder="Enter CAPTCHA code" required autocomplete="off" style="text-transform: uppercase;">
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>

            <div class="auth-links">
                <p class="mb-1">
                    <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
                </p>
                <p class="mb-0">
                    Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
